<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shopping Cart - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#3c6ce7",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: { display: ["Inter"] },
                },
            },
        };
    </script>
</head>

<body class="bg-background-light font-display text-slate-900">

    <header
        class="flex items-center justify-between border-b border-slate-200 bg-white px-6 md:px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <a href="index.html" class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
                <h2 class="text-xl font-bold">Klipcart</h2>
            </a>
        </div>
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-sm font-medium hover:text-primary hidden sm:block">Continue Shopping</a>

            <button class="relative text-slate-600 hover:text-primary transition-colors cursor-default">
                <span class="material-symbols-outlined text-3xl">shopping_cart</span>
                <span id="cartTopCount"
                    class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
            </button>
        </div>
    </header>

    <main class="mx-auto max-w-[1200px] w-full px-6 py-10">
        <div class="flex flex-col lg:flex-row gap-10">
            <div class="flex-1">
                <div class="flex items-baseline justify-between mb-6 border-b border-slate-200 pb-4">
                    <h1 class="text-3xl font-extrabold tracking-tight">Shopping Cart</h1>
                    <span id="cartItemCount" class="text-slate-500 font-medium">0 items</span>
                </div>

                <div id="cartItemsContainer" class="flex flex-col gap-6">
                </div>
            </div>

            <aside class="w-full lg:w-[380px]">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-lg sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                    <div class="flex flex-col gap-4 mb-6">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Subtotal</span>
                            <span id="cartSubtotal" class="font-bold text-slate-900">₹0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Shipping Estimate</span>
                            <span class="font-bold text-green-500">FREE</span>
                        </div>
                        <div class="border-t border-slate-200 pt-4 mt-2">
                            <div class="flex justify-between items-baseline">
                                <span class="text-lg font-bold">Total</span>
                                <span id="cartTotal" class="text-2xl font-black text-primary">₹0</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="window.location.href='checkout.html'"
                        class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/30 transition-all">
                        Proceed to Checkout
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>

                    <div class="mt-6 flex flex-col gap-3">
                        <div class="flex items-center gap-3 p-3 bg-yellow-50 border border-yellow-100 rounded-lg">
                            <span class="material-symbols-outlined text-yellow-600">verified_user</span>
                            <span class="text-xs text-yellow-800 font-medium">Safe & Secure Checkout</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const API_CART = "https://klipcart.onrender.com/api/cart";
        const userId = localStorage.getItem("userId");

        async function loadCartItems() {
            if (!userId) {
                alert("⚠️ Please login to view your cart!");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(`${API_CART}/${userId}`);
                const cartItems = await response.json();

                const container = document.getElementById("cartItemsContainer");
                container.innerHTML = "";

                let totalAmount = 0;

                // Update Counts
                document.getElementById("cartTopCount").innerText = cartItems.length;
                document.getElementById("cartItemCount").innerText = `${cartItems.length} items`;

                if (cartItems.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-10 rounded-2xl border border-slate-200 text-center shadow-sm">
                            <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">remove_shopping_cart</span>
                            <h3 class="text-xl font-bold text-slate-900 mb-2">Your cart is empty!</h3>
                            <p class="text-slate-500 mb-6">Looks like you haven't added anything to your cart yet.</p>
                            <a href="index.html" class="bg-primary hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-colors inline-block">Start Shopping</a>
                        </div>`;
                    document.getElementById("cartSubtotal").innerText = "₹0";
                    document.getElementById("cartTotal").innerText = "₹0";
                    return;
                }

                cartItems.forEach(item => {
                    const product = item.product;
                    const finalPrice = product.salePrice && product.salePrice < product.price ? product.salePrice : product.price;
                    const itemTotal = finalPrice * item.quantity;
                    totalAmount += itemTotal;

                    container.innerHTML += `
                        <div class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-6 items-center sm:items-start relative group transition-all hover:shadow-md">
                            
                            <button onclick="removeFromCart(${item.id})" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-red-50 text-red-400 hover:text-white hover:bg-red-500 rounded-full transition-colors z-10" title="Remove Item">
                                <span class="material-symbols-outlined text-[18px]">delete</span>
                            </button>

                            <div class="w-24 h-24 sm:w-32 sm:h-32 bg-slate-50 rounded-xl border border-slate-100 p-2 flex-shrink-0 cursor-pointer" onclick="window.location.href='product-details.html?id=${product.id}'">
                                <img src="${product.imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=400'" class="w-full h-full object-contain mix-blend-multiply transition-transform group-hover:scale-110">
                            </div>

                            <div class="flex-1 flex flex-col justify-between h-full w-full">
                                <div>
                                    <h3 class="text-lg font-bold text-slate-900 mb-1 pr-8 cursor-pointer hover:text-primary" onclick="window.location.href='product-details.html?id=${product.id}'">${product.name}</h3>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${product.category}</p>
                                </div>
                                <div class="flex items-center justify-between mt-4">
                                    <p class="text-xl font-black text-primary">₹${finalPrice.toLocaleString('en-IN')}</p>
                                    <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-lg px-4 py-1.5 font-bold text-slate-700">
                                        Qty: ${item.quantity}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById("cartSubtotal").innerText = `₹${totalAmount.toLocaleString('en-IN')}`;
                document.getElementById("cartTotal").innerText = `₹${totalAmount.toLocaleString('en-IN')}`;

            } catch (error) {
                console.error("Error loading cart:", error);
            }
        }

        async function removeFromCart(cartItemId) {
            if (!confirm("Remove this item from your cart?")) return;
            try {
                const response = await fetch(`${API_CART}/remove/${cartItemId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadCartItems();
                } else {
                    alert("❌ Failed to remove item.");
                }
            } catch (error) {
                console.error("Error removing item:", error);
            }
        }

        window.onload = loadCartItems;
    </script>
</body>

</html>
