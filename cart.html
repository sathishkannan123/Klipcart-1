<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Shopping Cart - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#3c6ce7",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: { display: ["Inter"] },
                },
            },
        };
    </script>
</head>
<body class="bg-background-light font-display text-slate-900">
    
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 md:px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <a href="index.html" class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
                <h2 class="text-xl font-bold">Klipcart</h2>
            </a>
        </div>
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-sm font-medium hover:text-primary hidden sm:block">Continue Shopping</a>
            
            <button class="relative text-slate-600 hover:text-primary transition-colors cursor-default">
                <span class="material-symbols-outlined text-3xl">shopping_cart</span>
                <span id="cartTopCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-sm">0</span>
            </button>
        </div>
    </header>

    <main class="mx-auto max-w-[1200px] w-full px-6 py-10">
        <div class="flex flex-col lg:flex-row gap-10">
            <div class="flex-1">
                <div class="flex items-baseline justify-between mb-6 border-b border-slate-200 pb-4">
                    <h1 class="text-3xl font-extrabold tracking-tight">Shopping Cart</h1>
                    <span id="cartItemCount" class="text-slate-500 font-medium">0 items</span>
                </div>
                
                <div id="cartItemsContainer" class="flex flex-col gap-6">
                    </div>
            </div>

            <aside class="w-full lg:w-[380px]">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-lg sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                    <div class="flex flex-col gap-4 mb-6">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Subtotal</span>
                            <span id="cartSubtotal" class="font-bold text-slate-900">₹0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Shipping Estimate</span>
                            <span class="font-bold text-green-500">FREE</span>
                        </div>
                        <div class="border-t border-slate-200 pt-4 mt-2">
                            <div class="flex justify-between items-baseline">
                                <span class="text-lg font-bold">Total</span>
                                <span id="cartTotal" class="text-2xl font-black text-primary">₹0</span>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="window.location.href='checkout.html'" class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/30 transition-all">
                        Proceed to Checkout
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                    
                    <div class="mt-6 flex flex-col gap-3">
                        <div class="flex items-center gap-3 p-3 bg-yellow-50 border border-yellow-100 rounded-lg">
                            <span class="material-symbols-outlined text-yellow-600">verified_user</span>
                            <span class="text-xs text-yellow-800 font-medium">Safe & Secure Checkout</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        // 🌟 1. லாகின் செய்த கஸ்டமரின் Email-ஐ எடுக்கிறோம் 🌟
        const userEmail = localStorage.getItem("customerEmail");
        // Email இருந்தால் அந்த Email-வுடன் சேர்த்து Key உருவாக்குகிறோம், இல்லையென்றால் சாதாரணமாக 'cart'
        const CART_KEY = userEmail ? "klipcart_cart_" + userEmail : "cart";

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const container = document.getElementById('cartItemsContainer');
            
            document.getElementById('cartItemCount').innerText = `${cart.length} items`;
            document.getElementById('cartTopCount').innerText = cart.length; 

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-xl border border-slate-200">
                        <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">remove_shopping_cart</span>
                        <h2 class="text-2xl font-bold text-slate-700">Your cart is empty</h2>
                        <button onclick="window.location.href='index.html'" class="mt-6 bg-primary text-white px-6 py-3 rounded-lg font-bold">Shop Now</button>
                    </div>`;
                document.getElementById('cartSubtotal').innerText = "₹0";
                document.getElementById('cartTotal').innerText = "₹0";
                return;
            }

            let subtotal = 0;
            container.innerHTML = "";

            cart.forEach((item, index) => {
                subtotal += item.cartPrice * (item.qty || 1);
                
                container.innerHTML += `
                    <div class="flex flex-col md:flex-row items-center gap-6 p-4 rounded-xl bg-white border border-slate-200 shadow-sm relative group">
                        <div class="w-24 h-24 flex-shrink-0 bg-slate-50 rounded-lg overflow-hidden p-2">
                            <img src="${item.imageUrl.startsWith('http') ? item.imageUrl : 'https://klipcart.onrender.com/' + item.imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=100'" class="w-full h-full object-contain mix-blend-multiply">
                        </div>
                        <div class="flex flex-1 flex-col md:flex-row justify-between w-full">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">${item.name}</h3>
                                <p class="text-sm text-slate-500 mb-3 capitalize">${item.category}</p>
                                <button onclick="removeItem(${index})" class="text-red-500 text-xs font-bold flex items-center gap-1 hover:underline">
                                    <span class="material-symbols-outlined text-[16px]">delete</span> Remove
                                </button>
                            </div>
                            <div class="flex flex-col items-end justify-between mt-4 md:mt-0">
                                <p class="text-xl font-bold text-slate-900">₹${item.cartPrice}</p>
                            </div>
                        </div>
                    </div>`;
            });

            document.getElementById('cartSubtotal').innerText = `₹${subtotal}`;
            document.getElementById('cartTotal').innerText = `₹${subtotal}`;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            cart.splice(index, 1);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            loadCart(); 
        }

        window.onload = loadCart;
    </script>
</body>
</html>
