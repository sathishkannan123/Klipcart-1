<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Support - Klipcart Admin</title>
    <link rel="icon" type="image/svg+xml" href="admin-logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0">
        <div class="p-6 flex items-center gap-2 text-white mb-6 border-b border-slate-800">
            <span class="material-symbols-outlined text-blue-500 text-3xl">shopping_basket</span>
            <h2 class="text-2xl font-bold tracking-tight">Klipcart</h2>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            
            <a href="admin-allproduct.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">inventory_2</span> All Products
            </a>
            
            <a href="admin-add-product.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">add_box</span> Add Product
            </a>
            
            <a href="admin-order.html" onclick="markAsRead('order')" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors group">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined">local_shipping</span> All Orders
                </div>
                <span id="badge-orders" class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden shadow-sm">0</span>
            </a>
            
            <a href="admin-delivered.html" onclick="markAsRead('return')" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors group">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined">task_alt</span> Delivered Orders
                </div>
                <span id="badge-returns" class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden shadow-sm">0</span>
            </a>
            
            <a href="admin-customers.html" onclick="markAsRead('user')" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors group">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined">people</span> Customers
                </div>
                <span id="badge-users" class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden shadow-sm">0</span>
            </a>
            
            <a href="#" onclick="markAsRead('chat')" class="flex items-center justify-between px-4 py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/20 group">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined">support_agent</span> Live Chat
                </div>
                <span id="badge-chats" class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden shadow-sm">0</span>
            </a>
            
            <div class="mt-auto pb-4">
                <div class="h-px bg-slate-800 my-4"></div>
                <button onclick="adminLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-400 transition-colors font-bold">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </div>
            
        </nav>
    </aside>

    <main class="flex-1 flex bg-white m-4 rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
        
        <div class="w-1/3 border-r border-slate-200 flex flex-col bg-slate-50">
            <div class="p-5 border-b border-slate-200 bg-white">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-600">forum</span> Active Chats
                </h2>
            </div>
            <div id="customerList" class="flex-1 overflow-y-auto p-2 space-y-2">
            </div>
        </div>

        <div class="w-2/3 flex flex-col bg-[#f8fafc] relative">
            
            <div id="chatPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-white">
                <span class="material-symbols-outlined text-6xl mb-2 opacity-50">chat_bubble</span>
                <p class="font-medium">Select a customer to start chatting</p>
            </div>

            <div class="p-4 border-b border-slate-200 bg-white flex justify-between items-center shadow-sm z-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 text-blue-700 font-bold rounded-full flex items-center justify-center" id="activeAvatar">U</div>
                    <div>
                        <h3 class="font-bold text-slate-900" id="activeCustomerName">Customer Name</h3>
                        <p class="text-xs text-slate-500" id="activeCustomerEmail">email@example.com</p>
                    </div>
                </div>
            </div>

            <div id="adminChatMessages" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 z-0">
            </div>

            <div class="p-4 bg-white border-t border-slate-200 flex gap-3 z-0">
                <input type="text" id="adminInput" placeholder="Type your reply here..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-white transition-colors" onkeypress="if(event.key === 'Enter') sendAdminMessage()">
                <button onclick="sendAdminMessage()" class="bg-blue-600 text-white px-6 font-bold rounded-xl hover:bg-blue-700 shadow-md">Reply</button>
            </div>
        </div>
    </main>

    <script>
        // --- AUTHENTICATION & HEADERS ---
        const API_CHAT = "https://klipcart.onrender.com/api/chat";
        let currentActiveEmail = null;
        let globalChats = {}; 

        const adminToken = localStorage.getItem("klipcart_admin_token");
        if (!adminToken) {
            alert("Unauthorized Access! Please login as Admin.");
            window.location.href = "admin-login.html";
        }

        const authHeaders = {
            "Authorization": `Bearer ${adminToken}`,
            "Content-Type": "application/json"
        };

        // --- CHAT LOGIC ---
        async function loadChatList() {
            try {
                const response = await fetch(`${API_CHAT}/admin/all`);
                if (!response.ok) throw new Error("Failed to fetch chats");
                
                const allMessages = await response.json();
                
                // Group messages by customer email
                globalChats = {};
                allMessages.forEach(msg => {
                    if (!globalChats[msg.customerEmail]) {
                        globalChats[msg.customerEmail] = [];
                    }
                    globalChats[msg.customerEmail].push(msg);
                });

                renderCustomerList();

                // If a chat is currently open, refresh its messages
                if (currentActiveEmail) {
                    loadAdminMessages();
                }

            } catch (error) {
                console.error("Error loading chat list:", error);
            }
        }

        // 🌟 CUSTOMER LIST RENDERING WITH INDIVIDUAL BADGES 🌟
        function renderCustomerList() {
            const listDiv = document.getElementById("customerList");
            listDiv.innerHTML = "";

            const emails = Object.keys(globalChats);
            if(emails.length === 0) {
                listDiv.innerHTML = `<p class="text-sm text-center text-slate-400 mt-10">No active support requests.</p>`;
                return;
            }

            // ஒவ்வொரு கஸ்டமருக்கும் நாம் கடைசியாகப் பார்த்த மெசேஜ் எண்ணிக்கையை எடுத்தல்
            const knownCounts = JSON.parse(localStorage.getItem('admin_known_user_chat_counts')) || {};

            emails.forEach(email => {
                const chatArr = globalChats[email];
                const lastMsg = chatArr[chatArr.length - 1];
                const cName = lastMsg.customerName || email.split('@')[0];
                const initials = cName.substring(0,2).toUpperCase();

                // Badge கணக்கீடு
                const currentCount = chatArr.length;
                const knownCount = knownCounts[email] || 0;
                const unreadCount = currentCount - knownCount;

                let badgeHtml = '';
                let activeClass = '';

                // அந்த கஸ்டமர் பேஜ் திறந்திருந்தால், பேட்ஜ் காட்ட வேண்டாம், கணக்கை அப்டேட் செய்யவும்
                if (currentActiveEmail === email) {
                    knownCounts[email] = currentCount;
                    localStorage.setItem('admin_known_user_chat_counts', JSON.stringify(knownCounts));
                    activeClass = 'border-blue-400 shadow-md bg-blue-50/30';
                } 
                // கஸ்டமர் அனுப்பிய புது மெசேஜ் இருந்தால் Badge காட்டவும்
                else if (unreadCount > 0 && lastMsg.sender === 'customer') {
                    badgeHtml = `<span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm animate-pulse">${unreadCount}</span>`;
                }

                listDiv.innerHTML += `
                    <div onclick="openChat('${email}', '${cName}')" class="p-3 bg-white border ${activeClass || 'border-slate-100'} rounded-xl cursor-pointer hover:shadow-md hover:border-blue-300 transition-all flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-100 text-slate-600 font-bold rounded-full flex items-center justify-center shrink-0">${initials}</div>
                        <div class="flex-1 overflow-hidden">
                            <div class="flex justify-between items-center mb-1">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <h4 class="font-bold text-sm text-slate-900 truncate">${cName}</h4>
                                    ${badgeHtml}
                                </div>
                                <span class="text-[10px] text-slate-400 shrink-0">${lastMsg.time}</span>
                            </div>
                            <p class="text-xs ${unreadCount > 0 && lastMsg.sender === 'customer' ? 'text-slate-800 font-bold' : 'text-slate-500'} truncate">${lastMsg.text}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openChat(email, name) {
            currentActiveEmail = email;
            document.getElementById('chatPlaceholder').classList.add('hidden');
            document.getElementById('activeCustomerName').innerText = name;
            document.getElementById('activeCustomerEmail').innerText = email;
            document.getElementById('activeAvatar').innerText = name.substring(0,2).toUpperCase();
            
            // Auto mark Global chats as read 
            markAsRead('chat');
            
            // Auto mark this specific Customer's chat as read
            const knownCounts = JSON.parse(localStorage.getItem('admin_known_user_chat_counts')) || {};
            knownCounts[email] = globalChats[email] ? globalChats[email].length : 0;
            localStorage.setItem('admin_known_user_chat_counts', JSON.stringify(knownCounts));
            
            renderCustomerList(); // பேட்ஜை மறைக்க லிஸ்ட்டை ரீலோட் செய்கிறோம்
            loadAdminMessages();
        }

        function loadAdminMessages() {
            if(!currentActiveEmail || !globalChats[currentActiveEmail]) return;
            
            const myChat = globalChats[currentActiveEmail];
            const msgDiv = document.getElementById("adminChatMessages");
            
            msgDiv.innerHTML = "";
            myChat.forEach(msg => {
                const isAdmin = msg.sender === 'admin';
                msgDiv.innerHTML += `
                    <div class="max-w-[70%] ${isAdmin ? 'self-end bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl' : 'self-start bg-white border border-slate-200 text-slate-800 rounded-r-2xl rounded-tl-2xl shadow-sm'} p-3 text-sm">
                        ${msg.text}
                        <p class="text-[10px] ${isAdmin ? 'text-blue-200 text-right' : 'text-slate-400 text-left'} mt-1">${msg.time}</p>
                    </div>
                `;
            });
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }

        async function sendAdminMessage() {
            const text = document.getElementById("adminInput").value.trim();
            if(!text || !currentActiveEmail) return;

            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const customerNameStr = document.getElementById('activeCustomerName').innerText;
            
            const messagePayload = {
                customerEmail: currentActiveEmail,
                customerName: customerNameStr,
                sender: 'admin',
                text: text,
                time: timeString
            };

            document.getElementById("adminInput").value = "";

            try {
                const response = await fetch(`${API_CHAT}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(messagePayload)
                });

                if (response.ok) {
                    loadChatList();
                }
            } catch (error) {
                console.error("Error sending admin message:", error);
            }
        }

        function adminLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("klipcart_admin_token");
                localStorage.removeItem("klipcart_admin_session");
                window.location.href = "admin-login.html";
            }
        }

        // 🌟 UNIVERSAL BADGE NOTIFICATION SYSTEM 🌟
        window.liveDataCounts = {};

        async function syncAdminBadges() {
            const ENDPOINTS = {
                orders: "https://klipcart.onrender.com/api/orders",
                users: "https://klipcart.onrender.com/api/admin/users",
                returns: "https://klipcart.onrender.com/api/returns/admin/all",
                chats: "https://klipcart.onrender.com/api/chat/admin/all"
            };

            const token = localStorage.getItem("klipcart_admin_token");
            const headers = token ? { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" } : {};

            try {
                const [ordersRes, usersRes, returnsRes, chatsRes] = await Promise.all([
                    fetch(ENDPOINTS.orders).catch(() => ({ ok: false })),
                    fetch(ENDPOINTS.users, { headers }).catch(() => ({ ok: false })),
                    fetch(ENDPOINTS.returns).catch(() => ({ ok: false })),
                    fetch(ENDPOINTS.chats).catch(() => ({ ok: false }))
                ]);

                if(ordersRes.ok) {
                    const data = await ordersRes.json();
                    window.liveDataCounts['order'] = data.length;
                    updateUniversalBadge('badge-orders', data.length, 'admin_known_order_count');
                }
                if(usersRes.ok) {
                    const data = await usersRes.json();
                    const customersOnly = data.filter(u => u.role !== "ADMIN");
                    window.liveDataCounts['user'] = customersOnly.length;
                    updateUniversalBadge('badge-users', customersOnly.length, 'admin_known_user_count');
                }
                if(returnsRes.ok) {
                    const data = await returnsRes.json();
                    window.liveDataCounts['return'] = data.length;
                    updateUniversalBadge('badge-returns', data.length, 'admin_known_return_count');
                }
                if(chatsRes.ok) {
                    const data = await chatsRes.json();
                    const customerMessages = data.filter(msg => msg.sender === 'customer');
                    window.liveDataCounts['chat'] = customerMessages.length;
                    updateUniversalBadge('badge-chats', customerMessages.length, 'admin_known_chat_count');
                }
            } catch(e) {
                console.error("Badge Sync Error:", e);
            }
        }

        function updateUniversalBadge(elementId, liveCount, storageKey) {
            const knownCount = parseInt(localStorage.getItem(storageKey)) || 0;
            const diff = liveCount - knownCount;
            const badgeEl = document.getElementById(elementId);
            
            if(badgeEl) {
                if(diff > 0) {
                    badgeEl.innerText = diff > 99 ? '99+' : diff;
                    badgeEl.classList.remove('hidden');
                } else {
                    badgeEl.classList.add('hidden');
                }
            }
        }

        window.markAsRead = function(type) {
            if (window.liveDataCounts && window.liveDataCounts[type] !== undefined) {
                localStorage.setItem(`admin_known_${type}_count`, window.liveDataCounts[type]);
            }
        };

        window.onload = () => {
            loadChatList();
            syncAdminBadges();
            
            // Poll for chat updates every 3 seconds
            setInterval(loadChatList, 3000);
            
            // Poll for global badge updates every 5 seconds
            setInterval(syncAdminBadges, 5000);
        };
    </script>
</body>
</html>
