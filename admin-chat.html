<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Support - Klipcart Admin</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0">
        <div class="p-6 flex items-center gap-2 text-white mb-6 border-b border-slate-800">
            <span class="material-symbols-outlined text-blue-500 text-3xl">shopping_basket</span>
            <h2 class="text-2xl font-bold tracking-tight">Klipcart</h2>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <a href="admin-allproduct.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">inventory_2</span> All Products
            </a>
            <a href="admin-add-product.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">add_box</span> Add Product
            </a>
            <a href="admin-order.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white">
                <span class="material-symbols-outlined">local_shipping</span> All Orders
            </a>
            <a href="admin-delivered.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                <span class="material-symbols-outlined">task_alt</span> Delivered Orders
            </a>
            <a href="admin-customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white">
                <span class="material-symbols-outlined">people</span> Customers
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined">support_agent</span> Live Chat Support
            </a>
            <div class="mt-auto pb-4">
                <div class="h-px bg-slate-800 my-4"></div>
                <button onclick="adminLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-400 transition-colors font-bold">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex bg-white m-4 rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
        
        <div class="w-1/3 border-r border-slate-200 flex flex-col bg-slate-50">
            <div class="p-5 border-b border-slate-200 bg-white">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-600">forum</span> Active Chats
                </h2>
            </div>
            <div id="customerList" class="flex-1 overflow-y-auto p-2 space-y-2">
                </div>
        </div>

        <div class="w-2/3 flex flex-col bg-[#f8fafc] relative">
            
            <div id="chatPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-white">
                <span class="material-symbols-outlined text-6xl mb-2 opacity-50">chat_bubble</span>
                <p class="font-medium">Select a customer to start chatting</p>
            </div>

            <div class="p-4 border-b border-slate-200 bg-white flex justify-between items-center shadow-sm z-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 text-blue-700 font-bold rounded-full flex items-center justify-center" id="activeAvatar">U</div>
                    <div>
                        <h3 class="font-bold text-slate-900" id="activeCustomerName">Customer Name</h3>
                        <p class="text-xs text-slate-500" id="activeCustomerEmail">email@example.com</p>
                    </div>
                </div>
            </div>

            <div id="adminChatMessages" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 z-0">
                </div>

            <div class="p-4 bg-white border-t border-slate-200 flex gap-3 z-0">
                <input type="text" id="adminInput" placeholder="Type your reply here..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-white transition-colors" onkeypress="if(event.key === 'Enter') sendAdminMessage()">
                <button onclick="sendAdminMessage()" class="bg-blue-600 text-white px-6 font-bold rounded-xl hover:bg-blue-700 shadow-md">Reply</button>
            </div>
        </div>
    </main>

    <script>
        let currentActiveEmail = null;

        function loadChatList() {
            const allChats = JSON.parse(localStorage.getItem("klipcart_chats")) || {};
            const listDiv = document.getElementById("customerList");
            listDiv.innerHTML = "";

            const emails = Object.keys(allChats);
            if(emails.length === 0) {
                listDiv.innerHTML = `<p class="text-sm text-center text-slate-400 mt-10">No active support requests.</p>`;
                return;
            }

            emails.forEach(email => {
                const chatArr = allChats[email];
                const lastMsg = chatArr[chatArr.length - 1];
                const customerName = lastMsg.name || email.split('@')[0];
                
                // Avatar Initials
                const initials = customerName.substring(0,2).toUpperCase();

                listDiv.innerHTML += `
                    <div onclick="openChat('${email}', '${customerName}')" class="p-3 bg-white border border-slate-100 rounded-xl cursor-pointer hover:shadow-md hover:border-blue-300 transition-all flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-100 text-slate-600 font-bold rounded-full flex items-center justify-center">${initials}</div>
                        <div class="flex-1 overflow-hidden">
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="font-bold text-sm text-slate-900 truncate">${customerName}</h4>
                                <span class="text-[10px] text-slate-400">${lastMsg.time}</span>
                            </div>
                            <p class="text-xs text-slate-500 truncate">${lastMsg.text}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openChat(email, name) {
            currentActiveEmail = email;
            document.getElementById('chatPlaceholder').classList.add('hidden');
            document.getElementById('activeCustomerName').innerText = name;
            document.getElementById('activeCustomerEmail').innerText = email;
            document.getElementById('activeAvatar').innerText = name.substring(0,2).toUpperCase();
            loadAdminMessages();
        }

        function loadAdminMessages() {
            if(!currentActiveEmail) return;
            const allChats = JSON.parse(localStorage.getItem("klipcart_chats")) || {};
            const myChat = allChats[currentActiveEmail] || [];
            const msgDiv = document.getElementById("adminChatMessages");
            
            msgDiv.innerHTML = "";
            myChat.forEach(msg => {
                const isAdmin = msg.sender === 'admin';
                msgDiv.innerHTML += `
                    <div class="max-w-[70%] ${isAdmin ? 'self-end bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl' : 'self-start bg-white border border-slate-200 text-slate-800 rounded-r-2xl rounded-tl-2xl shadow-sm'} p-3 text-sm">
                        ${msg.text}
                        <p class="text-[10px] ${isAdmin ? 'text-blue-200 text-right' : 'text-slate-400 text-left'} mt-1">${msg.time}</p>
                    </div>
                `;
            });
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }

        function sendAdminMessage() {
            const text = document.getElementById("adminInput").value.trim();
            if(!text || !currentActiveEmail) return;

            let allChats = JSON.parse(localStorage.getItem("klipcart_chats")) || {};
            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            allChats[currentActiveEmail].push({ sender: 'admin', text: text, time: timeString });
            localStorage.setItem("klipcart_chats", JSON.stringify(allChats));
            
            document.getElementById("adminInput").value = "";
            loadAdminMessages();
            loadChatList(); // Update sidebar last message
        }
        // 🌟 Admin Logout Function 🌟
        function adminLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("klipcart_admin_token");
                localStorage.removeItem("klipcart_admin_session");
                window.location.href = "admin-login.html";
            }
        }

        // Auto Refresh
        setInterval(() => {
            loadChatList();
            if(currentActiveEmail) loadAdminMessages();
        }, 2000);


        window.onload = loadChatList;
    </script>
</body>
</html>
