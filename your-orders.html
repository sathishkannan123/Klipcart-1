<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 px-4 md:px-10 py-4 shadow-sm sticky top-0 z-50">
        <div class="max-w-[1200px] mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-blue-600 hover:scale-105 transition-transform">
                <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
                <h2 class="text-2xl font-black tracking-tight">Klipcart</h2>
            </a>
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-5 py-2.5 rounded-xl transition-colors text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Shop
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-[900px] mx-auto w-full px-4 py-10">
        <h1 class="text-2xl md:text-3xl font-black text-slate-900 mb-8 flex items-center gap-3">
            <span class="material-symbols-outlined text-blue-600 bg-blue-50 p-2 rounded-full">shopping_bag</span> 
            Your Orders
        </h1>

        <div id="ordersContainer" class="space-y-6">
            </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-slate-500 font-medium text-sm">© 2026 Klipcart Inc. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const API_URL = "https://klipcart.onrender.com/api/orders";
        const loggedInEmail = localStorage.getItem("customerEmail");

        async function loadMyOrders() {
            if (!loggedInEmail) {
                alert("Please login to view your orders.");
                window.location.href = "login.html";
                return;
            }

            const container = document.getElementById('ordersContainer');
            container.innerHTML = `<div class="flex justify-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-b-4 border-blue-600 border-t-transparent"></div></div>`;

            let returns = JSON.parse(localStorage.getItem('klipcart_returns')) || {}; 
            let returnDates = JSON.parse(localStorage.getItem('klipcart_return_dates')) || {}; 
            let refunds = JSON.parse(localStorage.getItem('klipcart_refunds')) || {}; 

            try {
                // Fetch all orders from the Database
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Failed to fetch orders");
                
                const allOrders = await res.json();
                
                // Filter orders belonging only to the logged-in user
                const myOrders = allOrders.filter(order => order.customerEmail === loggedInEmail);

                // Reverse array to show latest orders first
                myOrders.reverse();

                if(myOrders.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-10 rounded-3xl border border-slate-200 text-center shadow-sm">
                            <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">inventory_2</span>
                            <h3 class="text-xl font-bold text-slate-900 mb-2">No orders found</h3>
                            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl inline-block mt-4 transition-colors">Start Shopping</a>
                        </div>`;
                    return;
                }

                container.innerHTML = "";
                
                myOrders.forEach(order => {
                    const formattedOrderId = `KLIP-${order.id}`;
                    // Convert total amount to proper format (assuming it's stored as a number in DB)
                    const formattedTotal = `₹${Number(order.totalAmount).toLocaleString('en-IN')}`;
                    
                    // The backend returns productNames as a single string (e.g., "Mobile (Qty: 1), Laptop (Qty: 2)")
                    // We split this string to create simple list items.
                    const productsList = order.productNames.split(',').map(prod => prod.trim());
                    
                    let itemsHtml = "";
                    productsList.forEach(productString => {
                        itemsHtml += `
                            <div class="flex items-center gap-4 py-3 border-b border-slate-100 last:border-0">
                                <div class="w-12 h-12 bg-slate-50 rounded-lg flex items-center justify-center border border-slate-100 shrink-0 text-slate-400">
                                    <span class="material-symbols-outlined">category</span>
                                </div>
                                <div class="flex-1">
                                    <p class="font-bold text-slate-900 text-sm">${productString}</p>
                                </div>
                            </div>`;
                    });

                    let statusInfo = "";
                    let actionButtons = "";
                    let isReturned = returns[formattedOrderId] ? true : false;
                    let pickupDate = returnDates[formattedOrderId]; 
                    let isRefunded = refunds[formattedOrderId]; 

                    // In your backend, the default status is likely null or "PENDING". 
                    // Let's default to PENDING if status is missing.
                    const currentStatus = order.status || 'PENDING';

                    if (currentStatus === 'DELIVERED') {
                        if(isRefunded) {
                            statusInfo = `<div class="flex items-center gap-1.5 text-purple-700 font-bold text-sm bg-purple-100 px-3 py-2 rounded-lg border border-purple-200"><span class="material-symbols-outlined text-[18px]">verified</span> Refund Processed</div>`;
                            actionButtons = `<span class="text-xs font-bold text-slate-400 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">Return Closed</span>`;
                        } else if (isReturned) {
                            if(pickupDate) {
                                const formattedPickup = new Date(pickupDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                                statusInfo = `<div class="flex items-center gap-1.5 text-blue-700 font-bold text-sm bg-blue-100 px-3 py-2 rounded-lg border border-blue-200"><span class="material-symbols-outlined text-[18px]">local_shipping</span> Pickup: ${formattedPickup}</div>`;
                                actionButtons = `<span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">Agent will contact you</span>`;
                            } else {
                                statusInfo = `<div class="flex items-center gap-1.5 text-pink-600 font-bold text-sm bg-pink-50 px-3 py-2 rounded-lg border border-pink-100"><span class="material-symbols-outlined text-[18px]">assignment_return</span> Return Requested</div>`;
                                actionButtons = `<span class="text-xs font-bold text-slate-400">Awaiting pickup date...</span>`;
                            }
                        } else {
                            statusInfo = `<div class="flex items-center gap-1.5 text-green-600 font-bold text-sm bg-green-50 px-3 py-2 rounded-lg border border-green-100"><span class="material-symbols-outlined text-[18px]">task_alt</span> Delivered</div>`;
                            actionButtons = `<button onclick="window.location.href='return-request.html?id=${formattedOrderId}'" class="bg-white border border-slate-300 text-slate-700 hover:border-pink-500 hover:text-pink-600 font-bold px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 text-sm shadow-sm"><span class="material-symbols-outlined text-[18px]">assignment_return</span> Return Item</button>`;
                        }
                    } else {
                        let statusColor = currentStatus === 'SHIPPED' ? 'text-blue-600 bg-blue-50 border-blue-100' : 'text-yellow-600 bg-yellow-50 border-yellow-100';
                        let statusIcon = currentStatus === 'SHIPPED' ? 'local_shipping' : 'pending_actions';
                        statusInfo = `<div class="flex items-center gap-1.5 ${statusColor} font-bold text-sm px-3 py-2 rounded-lg border"><span class="material-symbols-outlined text-[18px]">${statusIcon}</span> Order ${currentStatus}</div>`;
                        actionButtons = `
                            <button onclick="window.location.href='track-order.html?id=${formattedOrderId}'" class="bg-white border border-blue-200 text-blue-600 hover:bg-blue-50 font-bold px-4 py-2 rounded-xl transition-all text-sm shadow-sm flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">my_location</span> Track</button>
                            <button onclick="cancelOrder('${order.id}', '${formattedOrderId}')" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 font-bold px-4 py-2 rounded-xl transition-all text-sm shadow-sm flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">cancel</span> Cancel</button>
                        `;
                    }

                    // Display fallback date if DB date is missing
                    const orderDate = order.date ? order.date : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                    container.innerHTML += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition-shadow hover:shadow-md">
                            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                <div><p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Order ID</p><p class="font-black text-slate-900">${formattedOrderId}</p></div>
                                <div><p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Order Date</p><p class="font-bold text-slate-800">${orderDate}</p></div>
                                <div class="text-right"><p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Total Amount</p><p class="font-black text-blue-600 text-lg">${formattedTotal}</p></div>
                            </div>
                            <div class="px-6 py-2">${itemsHtml}</div>
                            <div class="bg-slate-50/50 px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                                ${statusInfo}
                                <div class="flex items-center gap-3 w-full sm:w-auto">${actionButtons}</div>
                            </div>
                        </div>`;
                });

            } catch (error) {
                console.error("Fetch error:", error);
                container.innerHTML = `<div class="bg-red-50 text-red-500 p-8 rounded-2xl border border-red-200 text-center font-bold">Failed to load orders. Please make sure the backend server is running.</div>`;
            }
        }

        async function cancelOrder(dbId, displayId) {
            if(confirm(`Are you sure you want to cancel order ${displayId}?`)) {
                try {
                    // Send Delete Request to Backend
                    const res = await fetch(`${API_URL}/${dbId}`, { method: "DELETE" });
                    
                    if(res.ok) {
                        alert(`${displayId} has been successfully cancelled.`);
                        loadMyOrders(); // Refresh the list
                    } else {
                        alert("Failed to cancel order on the server.");
                    }
                } catch(e) {
                    alert("Backend server unreachable. Could not cancel order.");
                }
            }
        }

        window.onload = loadMyOrders;
    </script>
</body>
</html>
