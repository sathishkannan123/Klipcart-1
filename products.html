<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Collection - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center gap-4">
                
                <div class="flex items-center gap-3">
                    <a href="index.html" class="w-10 h-10 bg-slate-100 text-slate-600 hover:bg-blue-100 hover:text-blue-600 rounded-full flex items-center justify-center transition-colors">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <a href="index.html" class="flex items-center gap-2 text-blue-600 hover:scale-105 transition-transform shrink-0">
                        <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
                        <h2 class="text-2xl font-black tracking-tight hidden sm:block text-slate-900">Klipcart</h2>
                    </a>
                </div>

                <div class="flex items-center gap-5 sm:gap-6 shrink-0">
                    
                    <a href="wishlist.html" class="relative text-slate-500 hover:text-pink-500 transition-colors flex flex-col items-center group">
                        <span class="material-symbols-outlined text-[26px] md:text-[28px] group-hover:scale-110 transition-transform">favorite</span>
                        <span class="absolute -top-1.5 -right-1.5 bg-pink-500 text-white text-[10px] font-bold w-4 h-4 md:w-5 md:h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm" id="navWishlistBadge">0</span>
                    </a>
                    
                    <button onclick="window.location.href='cart.html'" class="relative text-slate-500 hover:text-blue-600 transition-colors flex flex-col items-center group focus:outline-none">
                        <span class="material-symbols-outlined text-[26px] md:text-[28px] group-hover:scale-110 transition-transform">shopping_cart</span>
                        <span id="navCartBadge" class="absolute -top-1.5 -right-1.5 bg-blue-600 text-white text-[10px] font-bold w-4 h-4 md:w-5 md:h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm">0</span>
                    </button>

                    <div class="relative z-50">
                        <button onclick="toggleDropdown()" class="flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-colors group focus:outline-none">
                            <span id="profileIcon" class="material-symbols-outlined text-[26px] md:text-[28px] group-hover:scale-110 transition-transform">account_circle</span>
                            <span id="accountText" class="hidden sm:block font-bold text-sm">Account</span>
                        </button>

                        <div id="accountDropdown" class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 py-3 transform transition-all origin-top-right">
                            <div id="guestMenu">
                                <a href="login.html" class="block px-5 py-2.5 text-sm font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center gap-3">
                                    <span class="material-symbols-outlined text-[18px]">login</span> Login / Signup
                                </a>
                            </div>
                            <div id="userMenu" class="hidden">
                                <div class="px-5 py-2 mb-1 border-b border-slate-50 bg-slate-50/50">
                                    <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Welcome</span>
                                    <span class="block text-sm font-black text-slate-900 truncate" id="displayNameMenu">User Name</span>
                                </div>
                                <a href="profile.html" class="block px-5 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors flex items-center gap-3 mt-1">
                                    <span class="material-symbols-outlined text-[18px]">person</span> My Profile
                                </a>
                                <a href="your-orders.html" class="block px-5 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors flex items-center gap-3">
                                    <span class="material-symbols-outlined text-[18px]">shopping_bag</span> Your Orders
                                </a>
                                <div class="h-px bg-slate-100 my-1"></div>
                                <button onclick="logout()" class="w-full text-left px-5 py-2.5 text-sm font-bold text-red-500 hover:bg-red-50 transition-colors flex items-center gap-3">
                                    <span class="material-symbols-outlined text-[18px]">logout</span> Logout
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-12 shadow-inner">
        <div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-4">
            <span class="material-symbols-outlined text-5xl opacity-80" id="categoryIcon">category</span>
            <div>
                <h2 id="categoryTitle" class="text-3xl md:text-4xl font-extrabold tracking-tight capitalize">Loading...</h2>
                <p class="mt-1 text-blue-100 text-sm md:text-base font-medium">Explore our premium collection of products</p>
            </div>
        </div>
    </div>

    <main class="flex-grow max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <div id="loader" class="flex justify-center items-center py-20 hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 border-t-transparent"></div>
        </div>

        <div id="productContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 items-stretch">
            </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm font-medium">&copy; 2026 Klipcart Inc. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");
        
        // 🌟 1. User Specific Keys Setup 🌟
        const userEmail = localStorage.getItem("customerEmail");
        const CART_KEY = userEmail ? "klipcart_cart_" + userEmail : "cart";
        const WISHLIST_KEY = userEmail ? "klipcart_wishlist_" + userEmail : "klipcart_wishlist";

        // 🌟 Initialize Badges & Profile 🌟
        function updateBadges() {
            const cartItems = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const wishlistItems = JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
            document.getElementById("navCartBadge").innerText = cartItems.length;
            document.getElementById("navWishlistBadge").innerText = wishlistItems.length;
        }

        function updateAccountMenu() {
            const name = localStorage.getItem("customerName");
            if (name) {
                document.getElementById("accountText").innerText = name;
                document.getElementById("displayNameMenu").innerText = name;
                document.getElementById("guestMenu").classList.add("hidden");
                document.getElementById("userMenu").classList.remove("hidden");
            } else {
                document.getElementById("accountText").innerText = "Account";
                document.getElementById("guestMenu").classList.remove("hidden");
                document.getElementById("userMenu").classList.add("hidden");
            }
        }

        function toggleDropdown() { document.getElementById("accountDropdown").classList.toggle("hidden"); }
        
        function logout() { 
            localStorage.removeItem("customerEmail");
            localStorage.removeItem("customerName");
            window.location.href = "index.html"; 
        }

        document.addEventListener("click", function (event) {
            const dropdown = document.getElementById("accountDropdown");
            if (!event.target.closest(".relative")) { dropdown?.classList.add("hidden"); }
        });

        // 🌟 Add to Cart / Wishlist Logic (User Specific) 🌟
        function addToCart(id, name, price, salePrice, category, imageUrl) {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const existingItem = cart.find(item => item.id === id);
            
            let finalPrice = salePrice && salePrice < price ? salePrice : price;

            if (existingItem) {
                existingItem.qty = (existingItem.qty || 1) + 1;
            } else {
                cart.push({ id, name, cartPrice: finalPrice, category, imageUrl, qty: 1 });
            }
            
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateBadges();
            alert(`🛒 ${name} added to your cart!`);
        }

        function toggleWishlist(btnElement, id, name, price, category, imageUrl) {
            let wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
            const index = wishlist.findIndex(item => item.id === id);
            const icon = btnElement.querySelector('span');

            if (index > -1) {
                wishlist.splice(index, 1);
                icon.classList.remove('text-pink-500');
                icon.classList.add('text-slate-300');
                icon.style.fontVariationSettings = "'FILL' 0";
            } else {
                wishlist.push({ id, name, price, category, imageUrl });
                icon.classList.remove('text-slate-300');
                icon.classList.add('text-pink-500');
                icon.style.fontVariationSettings = "'FILL' 1";
            }
            localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
            updateBadges();
        }

        // 🌟 Load Products 🌟
        window.onload = function() {
            updateAccountMenu();
            updateBadges();

            const titleEl = document.getElementById("categoryTitle");
            const iconEl = document.getElementById("categoryIcon");
            const container = document.getElementById("productContainer");
            const loader = document.getElementById("loader");

            if(category) {
                titleEl.innerText = category;
                
                const icons = { 'mobile': 'smartphone', 'laptop': 'laptop_mac', 'watch': 'watch', 'earphone': 'headphones', 'tv': 'tv' };
                iconEl.innerText = icons[category.toLowerCase()] || 'category';

                loader.classList.remove("hidden");

                fetch("https://klipcart.onrender.com/api/products/category/" + category)
                .then(res => res.json())
                .then(data => {
                    loader.classList.add("hidden");
                    container.innerHTML = "";

                    if(data.length === 0) {
                        container.innerHTML = `
                            <div class="col-span-full flex flex-col items-center justify-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">search_off</span>
                                <h3 class="text-2xl font-bold text-slate-900">Oops! No products found</h3>
                                <p class="mt-2 text-slate-500 text-center max-w-md">We couldn't find any products in the <span class="font-semibold text-slate-800 capitalize">${category}</span> category right now.</p>
                                <a href="index.html" class="mt-6 bg-blue-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg">Go Back Home</a>
                            </div>`;
                        return;
                    }

                    // Wishlist Heart Icon Check (User Specific)
                    let wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];

                    data.forEach(product => {
                        const isInWishlist = wishlist.some(item => item.id === product.id);
                        const heartIconClass = isInWishlist ? "text-pink-500" : "text-slate-300 hover:text-pink-400";
                        const heartFill = isInWishlist ? "'FILL' 1" : "'FILL' 0";

                        let priceHtml = `<p class="text-lg font-black text-slate-900 mt-auto">₹${product.price.toLocaleString('en-IN')}</p>`;
                        let badgeHtml = '';
                        
                        if(product.salePrice && product.salePrice < product.price) {
                            const discount = Math.round(((product.price - product.salePrice) / product.price) * 100);
                            priceHtml = `
                                <div class="mt-auto">
                                    <p class="text-xs text-slate-400 font-bold line-through mb-0.5">₹${product.price.toLocaleString('en-IN')}</p>
                                    <p class="text-lg font-black text-slate-900">₹${product.salePrice.toLocaleString('en-IN')}</p>
                                </div>
                            `;
                            badgeHtml = `<span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-md z-10 shadow-sm">${discount}% OFF</span>`;
                        }

                        container.innerHTML += `
                            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 group flex flex-col relative h-full overflow-hidden">
                                
                                <button onclick="toggleWishlist(this, ${product.id}, '${product.name.replace(/'/g, "\\'")}', ${product.price}, '${product.category}', '${product.imageUrl}')" 
                                        class="absolute top-3 right-3 z-10 w-8 h-8 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-sm transition-transform active:scale-90">
                                    <span class="material-symbols-outlined text-[18px] transition-colors duration-300 ${heartIconClass}" style="font-variation-settings: ${heartFill};">favorite</span>
                                </button>

                                <div class="relative w-full h-52 bg-slate-50 flex items-center justify-center p-4 border-b border-slate-100 cursor-pointer" onclick="window.location.href='product-details.html?id=${product.id}'">
                                    ${badgeHtml}
                                    <img src="${product.imageUrl.startsWith('http') ? product.imageUrl : 'https://klipcart.onrender.com/' + product.imageUrl}" 
                                         onerror="this.src='https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=400'" 
                                         class="w-full h-full object-contain mix-blend-multiply transition-transform duration-500 group-hover:scale-110">
                                </div>

                                <div class="p-5 flex-1 flex flex-col cursor-pointer" onclick="window.location.href='product-details.html?id=${product.id}'">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">${product.category}</p>
                                    <h3 class="font-bold text-slate-900 text-sm leading-snug mb-3 line-clamp-2 group-hover:text-blue-600 transition-colors">${product.name}</h3>
                                    
                                    <div class="flex items-end justify-between mt-auto pt-2 border-t border-slate-100">
                                        ${priceHtml}
                                        <button onclick="event.stopPropagation(); addToCart(${product.id}, '${product.name.replace(/'/g, "\\'")}', ${product.price}, ${product.salePrice}, '${product.category}', '${product.imageUrl}')" 
                                                class="w-9 h-9 bg-slate-900 hover:bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md transition-colors transform active:scale-95" title="Add to Cart">
                                            <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    loader.classList.add("hidden");
                    container.innerHTML = `
                        <div class="col-span-full text-center py-10">
                            <p class="text-red-500 font-bold bg-red-50 border border-red-200 p-6 rounded-xl inline-block">Backend Server is not running! ❌</p>
                        </div>`;
                });
            } else {
                titleEl.innerText = "All Products";
                document.getElementById("categoryIcon").innerText = "inventory_2";
                container.innerHTML = "<p class='col-span-full text-center text-slate-500 font-medium py-10'>No category selected.</p>";
            }
        };
    </script>
</body>
</html>
