<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - Klipcart Admin</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body class="flex min-h-screen text-slate-800">

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10 shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <a href="admin-allproduct.html" class="w-10 h-10 bg-slate-100 text-slate-600 hover:bg-blue-100 hover:text-blue-600 rounded-full flex items-center justify-center transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Edit Product</h1>
                    <p class="text-xs text-slate-500 font-medium" id="editProductId">Loading ID...</p>
                </div>
            </div>
        </header>

        <div class="p-8 flex-1 overflow-auto">
            
            <form id="editProductForm" enctype="multipart/form-data" class="max-w-5xl mx-auto space-y-8 hidden">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-8">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600">edit_square</span> Update Information
                            </h2>
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Product Name</label>
                                    <input type="text" id="name" name="name" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Full Description</label>
                                    <textarea id="description" name="description" required class="w-full border border-slate-300 rounded-xl px-4 py-3 h-40 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none resize-none"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600">payments</span> Pricing & Inventory
                            </h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Regular Price (₹)</label>
                                    <input type="number" step="0.01" id="price" name="price" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Sale Price (₹)</label>
                                    <input type="number" step="0.01" id="salePrice" name="salePrice" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Stock Quantity</label>
                                    <input type="number" id="stock" name="stock" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">SKU</label>
                                    <input type="text" id="sku" name="sku" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-8">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600">category</span> Organize
                            </h2>
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                                    <select id="category" name="category" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none cursor-pointer">
                                        <option value="mobile">Mobile</option>
                                        <option value="laptop">Laptop</option>
                                        <option value="earphone">Earphones</option>
                                        <option value="watch">Watch</option>
                                        <option value="tv">TV</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Tags</label>
                                    <input type="text" id="tags" name="tags" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-600 bg-slate-50 focus:bg-white text-sm outline-none">
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600">image</span> Update Image
                            </h2>
                            <div class="mb-4">
                                <p class="text-xs font-bold text-slate-500 mb-2">Current Image:</p>
                                <img id="currentImagePreview" src="" class="w-full h-32 object-contain bg-slate-50 rounded-lg border border-slate-200 p-2">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-2">Upload New Image (Optional)</label>
                                <input type="file" name="image" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-4 pt-6 border-t border-slate-200 pb-10">
                    <a href="admin-allproduct.html" class="px-6 py-3 border border-slate-300 text-slate-700 bg-white hover:bg-slate-50 rounded-xl font-bold transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">save</span> Save Changes
                    </button>
                </div>
            </form>
            
            <div id="loader" class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-blue-600 border-t-transparent"></div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        window.onload = async function() {
            if(!productId) {
                alert("Invalid Product ID!");
                window.location.href = "admin-allproduct.html";
                return;
            }

            try {
                const response = await fetch("https://klipcart.onrender.com/api/products");
                const products = await response.json();
                const product = products.find(p => p.id == productId);

                if(product) {
                    document.getElementById("editProductId").innerText = `Editing Product #${product.id}`;
                    document.getElementById("name").value = product.name;
                    document.getElementById("description").value = product.description;
                    document.getElementById("price").value = product.price;
                    document.getElementById("salePrice").value = product.salePrice || '';
                    document.getElementById("stock").value = product.stock;
                    document.getElementById("sku").value = product.sku;
                    document.getElementById("category").value = product.category;
                    document.getElementById("tags").value = product.tags || '';
                    document.getElementById("currentImagePreview").src = `https://klipcart.onrender.com/${product.imageUrl}`;

                    document.getElementById("loader").classList.add("hidden");
                    document.getElementById("editProductForm").classList.remove("hidden");
                } else {
                    alert("Product not found!");
                    window.location.href = "admin-allproduct.html";
                }
            } catch (error) {
                alert("Error loading product data.");
            }
        };

        document.getElementById("editProductForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Saving...`;
            submitBtn.disabled = true;

            const formData = new FormData(this);

            try {
                const response = await fetch(`https://klipcart.onrender.com/api/products/${productId}`, {
                    method: "PUT",
                    body: formData
                });

                if (response.ok) {
                    alert("🎉 Product Updated Successfully!");
                    window.location.href = "admin-allproduct.html";
                } else {
                    alert("❌ Error Updating Product.");
                }
            } catch (error) {
                alert("❌ Backend Server Not Running!");
            } finally {
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">save</span> Save Changes`;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
