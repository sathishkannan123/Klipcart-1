<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-10 left-10 w-72 h-72 bg-blue-600/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-700 shadow-2xl relative z-10">
        
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/30 mb-4">
                <span class="material-symbols-outlined text-4xl">admin_panel_settings</span>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Klipcart Admin</h1>
            <p class="text-slate-400 font-medium mt-1 text-sm">Secure JWT Login Portal</p>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Admin Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-slate-500 text-[20px]">mail</span>
                    <input type="email" id="adminEmail" placeholder="admin@klipcart.com" required 
                        class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-slate-500 text-[20px]">lock</span>
                    <input type="password" id="adminPassword" placeholder="••••••••" required 
                        class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-blue-600/30 mt-4 flex items-center justify-center gap-2">
                Access Dashboard <span class="material-symbols-outlined text-[18px]">login</span>
            </button>
        </form>
    </div>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById("adminEmail").value;
            const password = document.getElementById("adminPassword").value;
            const btn = event.target.querySelector('button');
            const originalText = btn.innerHTML;

            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Verifying...`;
            btn.disabled = true;

            try {
                // 🌟 Backend JWT Login API-ஐ அழைக்கிறோம் 🌟
                const response = await fetch("https://klipcart.onrender.com/admin-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (response.ok) {
                    // Backend-ல் இருந்து வரும் JSON-ஐ (Token-ஐ) படிக்கிறோம்
                    const data = await response.json();

                    // 🌟 Token மற்றும் Session-ஐ LocalStorage-ல் சேமிக்கிறோம் 🌟
                    localStorage.setItem("klipcart_admin_token", data.token); // முக்கியமானது
                    localStorage.setItem("klipcart_admin_session", "true");

                    alert("✅ Admin Login Successful!");
                    window.location.href = "admin-dashboard.html";
                } else {
                    const errorText = await response.text();
                    alert("❌ " + (errorText || "Invalid Admin Credentials!"));
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert("❌ Backend server is not running!");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
