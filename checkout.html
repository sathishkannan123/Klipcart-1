<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Checkout - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: "#3c6ce7", "background-light": "#f8fafc" }, fontFamily: { display: ["'Plus Jakarta Sans'", "sans-serif"] } },
            },
        };
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background-light font-display text-slate-900 flex flex-col min-h-screen">
    
    <header class="flex items-center justify-center border-b border-slate-200 bg-white py-5 shadow-sm sticky top-0 z-50">
        <a href="customer-home.html" class="flex items-center gap-2 text-primary hover:scale-105 transition-transform">
            <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
            <h2 class="text-2xl font-black tracking-tight">Klipcart <span class="text-slate-400 font-bold text-lg ml-2 border-l-2 border-slate-200 pl-3">Secure Checkout</span></h2>
        </a>
    </header>

    <main class="mx-auto max-w-[1200px] w-full px-4 md:px-6 py-10 flex-grow">
        <div class="flex flex-col lg:flex-row gap-10">
            
            <div class="flex-1 space-y-8">
                
                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary bg-blue-50 p-2 rounded-full">location_on</span>
                            Shipping Details
                        </h2>
                    </div>
                    
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Full Name</label>
                            <input type="text" id="checkoutName" placeholder="Enter your name" required
                                class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-primary transition-all bg-slate-50 focus:bg-white font-medium text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Phone Number</label>
                            <input type="text" id="checkoutPhone" placeholder="10-digit mobile number" required
                                class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-primary transition-all bg-slate-50 focus:bg-white font-medium text-sm">
                        </div>
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Complete Delivery Address</label>
                            <textarea id="checkoutAddress" placeholder="Door No, Street, City, Pincode" required rows="3"
                                class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-primary transition-all bg-slate-50 focus:bg-white font-medium text-sm resize-none"></textarea>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="material-symbols-outlined text-green-600 bg-green-50 p-2 rounded-full">payments</span>
                        Payment Method
                    </h2>
                    
                    <div class="space-y-4">
                        <label class="flex items-center justify-between p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-primary hover:bg-blue-50 transition-all has-[:checked]:border-primary has-[:checked]:bg-blue-50/50 has-[:checked]:ring-4 has-[:checked]:ring-blue-500/10">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment" class="w-5 h-5 text-primary accent-primary" checked>
                                <span class="font-bold text-slate-900">UPI (GPay, PhonePe, Paytm)</span>
                            </div>
                            <span class="material-symbols-outlined text-slate-400">qr_code_scanner</span>
                        </label>

                        <label class="flex items-center justify-between p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-primary hover:bg-blue-50 transition-all has-[:checked]:border-primary has-[:checked]:bg-blue-50/50 has-[:checked]:ring-4 has-[:checked]:ring-blue-500/10">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment" class="w-5 h-5 text-primary accent-primary">
                                <span class="font-bold text-slate-900">Credit / Debit Card</span>
                            </div>
                            <span class="material-symbols-outlined text-slate-400">credit_card</span>
                        </label>

                        <label class="flex items-center justify-between p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-primary hover:bg-blue-50 transition-all has-[:checked]:border-primary has-[:checked]:bg-blue-50/50 has-[:checked]:ring-4 has-[:checked]:ring-blue-500/10">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment" class="w-5 h-5 text-primary accent-primary">
                                <span class="font-bold text-slate-900">Cash on Delivery (COD)</span>
                            </div>
                            <span class="material-symbols-outlined text-slate-400">local_shipping</span>
                        </label>
                    </div>
                </div>

            </div>

            <aside class="w-full lg:w-[400px]">
                <div class="bg-slate-900 text-white rounded-3xl p-8 shadow-2xl sticky top-24">
                    <h2 class="text-xl font-bold mb-6 border-b border-slate-800 pb-4">Order Summary</h2>
                    
                    <div class="flex flex-col gap-4 mb-6">
                        <div class="flex justify-between text-slate-400 font-medium">
                            <span>Total Items</span>
                            <span id="checkoutItemsCount" class="font-bold text-white">0</span>
                        </div>
                        <div class="flex justify-between text-slate-400 font-medium">
                            <span>Subtotal</span>
                            <span id="checkoutSubtotal" class="font-bold text-white">₹0</span>
                        </div>
                        <div class="flex justify-between text-slate-400 font-medium">
                            <span>Delivery Fee</span>
                            <span class="font-bold text-green-400">FREE</span>
                        </div>
                        
                        <div class="border-t border-slate-800 pt-6 mt-2">
                            <div class="flex justify-between items-baseline">
                                <span class="text-lg font-bold text-slate-300">Total to Pay</span>
                                <span id="checkoutTotal" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">₹0</span>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="placeOrder()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl shadow-[0_8px_30px_rgba(59,130,246,0.3)] transition-all text-lg mt-4 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 group">
                        Confirm Order <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>

                    <p class="text-[11px] text-slate-400 text-center mt-6 flex items-center justify-center gap-1.5 font-bold uppercase tracking-wider">
                        <span class="material-symbols-outlined text-[16px] text-green-400">lock</span>
                        100% Secure Checkout
                    </p>
                </div>
            </aside>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-slate-500 font-medium text-sm">© 2026 Klipcart Inc. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const userEmail = localStorage.getItem("customerEmail");
        const CART_KEY = userEmail ? "klipcart_cart_" + userEmail : "cart";
        // 🌟 1. கஸ்டமரின் தனிப்பட்ட ஆர்டர் Key 🌟
        const ORDERS_KEY = userEmail ? "klipcart_orders_" + userEmail : "orders";

        async function loadCheckout() {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            if(cart.length === 0) {
                alert("Your cart is empty!");
                window.location.href = "customer-home.html";
                return;
            }

            let subtotal = 0;
            cart.forEach(item => subtotal += item.cartPrice * (item.qty || 1));

            document.getElementById('checkoutItemsCount').innerText = cart.length;
            document.getElementById('checkoutSubtotal').innerText = `₹${subtotal.toLocaleString('en-IN')}`;
            document.getElementById('checkoutTotal').innerText = `₹${subtotal.toLocaleString('en-IN')}`;

            if(userEmail) {
                try {
                    const res = await fetch(`https://klipcart.onrender.com/api/profile/${userEmail}`);
                    if(res.ok) {
                        const profileData = await res.json();
                        if(profileData.fullName) document.getElementById('checkoutName').value = profileData.fullName;
                        if(profileData.phone) document.getElementById('checkoutPhone').value = profileData.phone;
                        if(profileData.address) document.getElementById('checkoutAddress').value = profileData.address;
                    }
                } catch(e) { console.error("Profile auto-fill failed"); }
            } else {
                document.getElementById('checkoutName').value = "Guest User";
            }
        }

        async function placeOrder() {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            if(cart.length === 0) return;

            let subtotal = 0;
            // 🌟 Cart-ல் உள்ள பொருட்களின் பெயர்களையும், அளவையும் (Qty) பிரித்தெடுக்கிறோம் 🌟
            let productNamesList = cart.map(item => `${item.name} (Qty: ${item.qty || 1})`).join(', ');

            cart.forEach(item => subtotal += item.cartPrice * (item.qty || 1));

            const customerName = document.getElementById('checkoutName').value || "Guest User";
            const customerPhone = document.getElementById('checkoutPhone').value || "Not Provided";
            const deliveryAddress = document.getElementById('checkoutAddress').value || "Not Provided";
            const customerEmail = userEmail || "guest@klipcart.com"; 

            if(!document.getElementById('checkoutName').value || !document.getElementById('checkoutPhone').value || !document.getElementById('checkoutAddress').value) {
                alert("Please fill in all the Shipping Details!");
                return;
            }

            // 🌟 Backend-க்கு அனுப்பும் Data-வில் productNames-ஐ சேர்க்கிறோம் 🌟
            const orderData = {
                customerName: customerName,
                customerEmail: customerEmail,
                customerPhone: customerPhone,
                address: deliveryAddress,
                totalAmount: subtotal,
                productNames: productNamesList // <--- புதிதாகச் சேர்க்கப்பட்டது
            };

            try {
                const response = await fetch("https://klipcart.onrender.com/api/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderData)
                });

                if(response.ok) {
                    const savedOrder = await response.json(); 
                    
                    let localOrders = JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
                    localOrders.unshift({
                        orderId: "KLIP-" + savedOrder.id,
                        date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
                        items: cart,
                        total: "₹" + subtotal.toLocaleString('en-IN'),
                        status: savedOrder.status || "PENDING",
                        address: deliveryAddress 
                    });
                    
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(localOrders));
                    localStorage.removeItem(CART_KEY); 
                    
                    window.location.href = "order-success.html"; 
                } else {
                    alert("Failed to place order.");
                }
            } catch (error) {
                alert("Backend Server is not running! Cannot place order.");
            }
        }

        window.onload = loadCheckout;
    </script>
</body>
</html>
