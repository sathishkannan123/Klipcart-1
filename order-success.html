<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Order Successful - Klipcart</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: "#3c6ce7", "background-light": "#f6f6f8" }, fontFamily: { display: ["Inter"] } },
            },
        };
    </script>
</head>
<body class="bg-background-light font-display text-slate-900 flex flex-col min-h-screen">
    
    <header class="flex items-center justify-center border-b border-slate-200 bg-white py-4 shadow-sm">
        <a href="index.html" class="flex items-center gap-2 text-primary">
            <span class="material-symbols-outlined text-3xl font-bold">shopping_basket</span>
            <h2 class="text-2xl font-black tracking-tight">Klipcart</h2>
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white max-w-lg w-full rounded-3xl shadow-xl border border-slate-100 p-8 md:p-12 text-center transform transition-all hover:-translate-y-1 hover:shadow-2xl">
            
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-5xl text-green-500 font-bold">check_circle</span>
            </div>

            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Order Successful!</h1>
            <p class="text-slate-500 mb-8 leading-relaxed">Thank you for your purchase. Your order has been placed successfully and is being processed.</p>
            
            <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100 text-left">
                <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-3">
                    <span class="text-slate-500 font-medium">Order ID:</span>
                    <span id="orderId" class="font-bold text-slate-900">#KLIP-000000</span>
                </div>
                <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-3">
                    <span class="text-slate-500 font-medium">Date:</span>
                    <span id="orderDate" class="font-bold text-slate-900">Today</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 font-medium">Estimated Delivery:</span>
                    <span class="font-bold text-primary">3 - 5 Business Days</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="window.location.href='index.html'" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl transition-colors">
                    Continue Shopping
                </button>
                <button onclick="window.location.href='track-order.html'" class="flex-1 bg-primary hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-primary/30 transition-all">
                    Track Order
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center">
        <p class="text-slate-500 text-sm">© 2026 Klipcart Inc. All rights reserved.</p>
    </footer>

    <script>
        // Generate a random Order ID and today's date
        window.onload = function() {
            const randomId = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('orderId').innerText = `#KLIP-${randomId}`;
            
            const date = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('orderDate').innerText = date.toLocaleDateString('en-US', options);
        };
    </script>
</body>
</html>
